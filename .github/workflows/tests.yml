name: tests

# Runs the offline test suite on every push and pull request, so a change
# that breaks the app (or brings back a fixed bug) is caught before it ships.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-account-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-account-intel/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
